<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <!-- Operations wallpaper tile (used as a mask; colour comes from CSS). Warehouse-floor dot grid,
       delivery routes with stops, parcels and location pins. Edges line up so the tile repeats seamlessly. -->
  <defs>
    <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#000" fill-opacity=".55"/>
    </pattern>
  </defs>
  <rect width="320" height="320" fill="url(#g)"/>
  <g fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- delivery routes (enter and leave at matching edges) -->
    <path d="M0 62 H70 L96 88 V150 L120 174 H210 L236 148 V96 H320" stroke-dasharray="6 7"/>
    <path d="M150 320 V262 L176 236 H262 L290 264 V320" stroke-dasharray="6 7"/>
    <path d="M0 236 H40 L62 214 V180" stroke-dasharray="6 7"/>
    <!-- stops on the routes -->
    <circle cx="96" cy="88" r="4"/><circle cx="120" cy="174" r="4"/><circle cx="236" cy="148" r="4"/><circle cx="176" cy="236" r="4"/>
    <!-- parcels -->
    <g transform="translate(150 64)"><path d="M0 8 L14 0 L28 8 L14 16 Z"/><path d="M0 8 V24 L14 32 L28 24 V8"/><path d="M14 16 V32"/></g>
    <g transform="translate(24 128) scale(.8)"><path d="M0 8 L14 0 L28 8 L14 16 Z"/><path d="M0 8 V24 L14 32 L28 24 V8"/><path d="M14 16 V32"/></g>
    <g transform="translate(250 196) scale(.7)"><path d="M0 8 L14 0 L28 8 L14 16 Z"/><path d="M0 8 V24 L14 32 L28 24 V8"/><path d="M14 16 V32"/></g>
    <!-- location pins -->
    <g transform="translate(262 40)"><path d="M10 26 C10 26 0 16 0 9 A10 10 0 0 1 20 9 C20 16 10 26 10 26 Z"/><circle cx="10" cy="9" r="3.5"/></g>
    <g transform="translate(64 266) scale(.85)"><path d="M10 26 C10 26 0 16 0 9 A10 10 0 0 1 20 9 C20 16 10 26 10 26 Z"/><circle cx="10" cy="9" r="3.5"/></g>
    <!-- small truck -->
    <g transform="translate(186 278) scale(.9)"><rect x="0" y="4" width="22" height="14" rx="2"/><path d="M22 8 H30 L35 13 V18 H22"/><circle cx="7" cy="20" r="3"/><circle cx="28" cy="20" r="3"/></g>
  </g>
</svg>
